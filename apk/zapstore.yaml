summary: Minimal, offline-first, encrypted personal expense tracker — no account, no server.

description: |
  A minimal, fully offline personal expense tracker. No account, no server, no tracking
  — all your data stays encrypted on your device and never leaves it.

  Features:
  - NO permissions at all — not even INTERNET. The OS itself guarantees the app
    cannot phone home; verify it right in the APK manifest (since v1.5)
  - FLAG_SECURE: no screenshots, no screen recording, no preview in recents (v1.5)
  - Monthly overview: fixed costs, variable expenses, comparison to previous month
  - Annual overview (12-month table)
  - Fixed-cost management (monthly / yearly, historically correct active/inactive state)
  - CSV export (Excel / LibreOffice / Sheets) incl. a deduplicated fixed-cost summary
  - Tax usage per fixed cost (private / business / partial)
  - Debts / liabilities (v1.6): note open payments with amount, due date and note,
    tick them off, overdue items highlighted — optionally book a settled item as an expense
  - Encrypted vault: master password, AES-256-GCM, key via PBKDF2-SHA256 (600k iterations),
    auto-lock after inactivity
  - Encrypted .vault backup: export and import to move between devices — the import asks
    for the backup's password and only replaces existing data once the backup opens (v1.7)
  - Settings tab (v1.7): auto-lock 0/1/5/15/30 min, lock now, change master password,
    black (neon) or soft (navy) theme, manage your own categories, version display
  - Overview by category with search and category filter (v1.7)
  - Built-in manual; German and English, follows the system language on first start,
    switchable in-app
  - Alien-Investor family design (Orbitron / Share Tech Mono, bundled locally), mobile-first;
    dropdowns and the search clear button in the app's own style instead of grey system lists (v1.8)

  Works completely offline — built entirely on native WebCrypto, no external dependencies.

